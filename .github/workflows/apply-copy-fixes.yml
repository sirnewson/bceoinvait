name: Apply invitation copy fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply copy fixes
        run: node build-fix.js

      - name: Commit updated invitation
        run: |
          if git diff --quiet -- index.html; then
            echo "No copy changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update invitation copy and registration time"
          git push

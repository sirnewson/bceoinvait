name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two production deploys race. A newer commit supersedes an
# in-flight deploy of an older one.
concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Netlify credentials are configured
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          missing=""
          [ -n "$NETLIFY_AUTH_TOKEN" ] || missing="$missing NETLIFY_AUTH_TOKEN"
          [ -n "$NETLIFY_SITE_ID" ] || missing="$missing NETLIFY_SITE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Run the copy fixes here rather than relying on the commit produced by
      # apply-copy-fixes.yml: pushes made with the default GITHUB_TOKEN do not
      # trigger other workflows, so that bot commit would not start a deploy.
      # Building here keeps the uploaded site correct either way.
      - name: Apply copy fixes
        run: node build-fix.js

      - name: Deploy to production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli deploy \
            --prod \
            --dir "." \
            --message "${GITHUB_SHA::7} via GitHub Actions"
